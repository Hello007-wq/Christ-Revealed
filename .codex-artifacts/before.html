<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Before</title>
<style>
  :root { --blue:#186BFF; --gold:#FF8A02; --bg:#EEF4FF; --surface:#fff; --text:#222; --muted:#6F7A8A; --border:#D9E6FF; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Arial, sans-serif; background: linear-gradient(180deg, #f7faff, #eaf1ff); }
  .phone { width: 412px; height: 915px; margin: 0 auto; background: var(--bg); position: relative; overflow:hidden; border: 1px solid #c9d8f5; }
  .hero { margin: 16px; padding: 24px; border-radius: 28px; background: linear-gradient(135deg, var(--blue), #124fd1); color:#fff; }
  .hero h1 { margin:0; font-size: 28px; line-height: 1.1; }
  .hero p { margin:12px 0 0; opacity: .9; line-height: 1.45; }
  .card { margin: 0 16px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 20px; min-height: 120px; }
  .card h2 { margin:0 0 8px; font-size: 20px; color:var(--text); }
  .card p { margin:0; color:var(--muted); line-height:1.45; }
  .bottom-nav { position:absolute; left:0; right:0; bottom:0; height:88px; background:#fff; border-top:1px solid var(--border); display:flex; }
  .item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-width:0; padding:8px 4px 10px; }
  .icon { width:22px; height:22px; border-radius:7px; background:#dbe8ff; position:relative; }
  .icon::after { content:''; position:absolute; inset:6px; border-radius:3px; background:var(--blue); }
  .label { max-width:100%; font-size: 10px; line-height:1; font-weight:700; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .active .label { color: var(--blue); }
  .active .icon { background: rgba(24,107,255,.14); }
  .active .icon::after { background: var(--blue); }
  .store .icon::after { background: var(--gold); }
  .store.active .icon { background: rgba(255,138,2,.14); }
  .community .icon::after { background: #27a061; }
  .community.active .icon { background: rgba(39,160,97,.14); }
</style>
</head>
<body>
  <div class="phone">
    <div class="hero"><h1>Home</h1><p>Live services, recent sermons, and community updates sit above a crowded seven-item bottom bar.</p></div>
    <div class="card"><h2>Why this is a problem</h2><p>Seven destinations squeeze labels, reduce hit area comfort, and make the bottom navigation feel cramped on Android.</p></div>
    <div class="bottom-nav">
      <div class="item active"><div class="icon"></div><div class="label">Home</div></div>
      <div class="item"><div class="icon"></div><div class="label">Playlists</div></div>
      <div class="item"><div class="icon"></div><div class="label">Downloads</div></div>
      <div class="item store"><div class="icon"></div><div class="label">Store</div></div>
      <div class="item community"><div class="icon"></div><div class="label">Community</div></div>
      <div class="item"><div class="icon"></div><div class="label">News</div></div>
      <div class="item"><div class="icon"></div><div class="label">Pastors</div></div>
    </div>
  </div>
</body>
</html>
