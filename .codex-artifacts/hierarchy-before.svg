<svg xmlns="http://www.w3.org/2000/svg" width="412" height="915" viewBox="0 0 412 915">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF" />
      <stop offset="100%" stop-color="#EAF1FF" />
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#186BFF" />
      <stop offset="100%" stop-color="#124FD1" />
    </linearGradient>
  </defs>
  <rect width="412" height="915" fill="url(#bg)" />
  <rect x="16" y="16" width="380" height="330" rx="30" fill="url(#hero)" />
  <text x="36" y="64" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CHRIST REVEALED MEDIA</text>
  <text x="36" y="114" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="32" font-weight="900">Video sermons only.</text>
  <text x="36" y="152" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="32" font-weight="900">Clean feed. No clutter.</text>
  <text x="36" y="205" fill="rgba(255,255,255,0.88)" font-family="Arial, sans-serif" font-size="15">Watch, react, comment, and build playlists</text>
  <text x="36" y="227" fill="rgba(255,255,255,0.88)" font-family="Arial, sans-serif" font-size="15">around the messages that matter to you.</text>
  <rect x="36" y="256" width="150" height="40" rx="20" fill="#FFFFFF" />
  <text x="111" y="281" fill="#186BFF" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Browse full library</text>
  <rect x="16" y="368" width="380" height="124" rx="24" fill="#FFFFFF" stroke="#D9E6FF" />
  <text x="36" y="404" fill="#222222" font-family="Arial, sans-serif" font-size="24" font-weight="900">Latest Sermon Feed</text>
  <text x="36" y="430" fill="#6F7A8A" font-family="Arial, sans-serif" font-size="14">Video-first. Audio remains available inside each sermon.</text>
  <rect x="16" y="522" width="380" height="230" rx="18" fill="#FFFFFF" stroke="#D9E6FF" />
  <rect x="16" y="772" width="380" height="88" rx="0" fill="#FFFFFF" stroke="#D9E6FF" />
